[build-system]
requires = ["setuptools>=77", "ziglang==0.16.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyghostty"
dynamic = ["version"]
description = "Python bindings for libghostty"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE.ghostty"]
authors = [{ name = "pyghostty contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = ["cffi"]

[project.optional-dependencies]
dev = [
  "fastship",
  "build",
  "cibuildwheel~=3.4",
  "ziglang==0.16.0",
  "pytest",
]

[project.urls]
Homepage = "https://github.com/AnswerDotAI/pyghostty"

[tool.setuptools.dynamic]
version = { attr = "pyghostty.__version__" }

[tool.setuptools.packages.find]
include = ["pyghostty"]

[tool.setuptools.package-data]
pyghostty = ["_lib/*"]

[tool.pyghostty]
ghostty-rev = "6467b1dab0be087fa8f0a7ccc7b3c5b88b9be7a5"
zig-version = "0.16.0"

[tool.cibuildwheel]
build = "cp311-*"
skip = "*-musllinux_* *-win32"
test-requires = "pytest"
test-command = "pytest {project}/tests"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "13.0" }
